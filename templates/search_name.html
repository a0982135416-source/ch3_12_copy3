{% extends "base.html" %}
{% block title %}
    <title>學生姓名搜尋</title>
{% endblock %}
{% block content %}
<section class="head_content form-heading">
    <p class="eyebrow">Search</p>
    <h1>學生姓名搜尋</h1>
    <a class="text-link" href="{% url "index" %}">回首頁</a>
</section>
<section class="form-panel">
    {% comment %}<form action="/search_list/" method="get">{% endcomment %}
    <form class="student-form compact-form" action="{% url 'search_list' %}" method="get">
        <label for="cname">姓名:</label>
        <input type="text" id="cname" name="cname">
        <p><button class="button primary" type="submit">搜尋</button></p>
    </form>
</section>
{% endblock %}
