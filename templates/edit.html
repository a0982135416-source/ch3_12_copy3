{% extends "base.html" %}
{% block title %}
    <title>學生資料管理系統-修改學生資料</title>
{% endblock %}
{% block content %}
<section class="head_content form-heading">
    <p class="eyebrow">Edit Student</p>
    <h1>學生資料管理系統-修改學生資料</h1>
    <a class="text-link" href="{% url "index" %}">回首頁</a>
</section>
<section class="form-panel">
    {% comment %} <form action="/edit/{{obj_data.cid}}" method="POST"> {% endcomment %}
    <form class="student-form" action="{% url 'edit' obj_data.cid %}" method="POST">
        {% csrf_token %}
        <table>
            <tr><!--value文字預設值-->
                <th>*姓名</th><td><input type="text" id="cname" name="cname" required placeholder="請輸入姓名" value="{{ obj_data.cname }}"></td>
            </tr>
            <tr>
                <th>*性別</th>
                <td>
                    <!--checked按鈕預設值-->
                    <input type="radio" id="csex_m" name="csex" value="M" {% if obj_data.csex == "M" %}checked{% endif %}>男
                    <input type="radio" id="csex_f" name="csex" value="F" {% if obj_data.csex == "F" %}checked{% endif %}>女
                </td>
            </tr>
            <tr><!--value=YYYY-mm-dd日期預設值-->
                <th>*生日</th><td><input type="date" id="cbirthday" name="cbirthday" required value="{{obj_data.cbirthday|date:'Y-m-d'}}"></td>
            </tr>
            <tr>
                <th>*信箱</th><td><input type="email" id="cemail" name="cemail" required placeholder="請輸入mail" value="{{ obj_data.cemail }}"></td>
            </tr>
            <tr>
                <th>&nbsp;&nbsp;電話</th><td><input type="text" id="cphone" name="cphone" value="{{ obj_data.cphone }}"></td>
            </tr>
            <tr>
                <th>&nbsp;&nbsp;地址</th><td><input type="text" id="caddr" name="caddr" value="{{ obj_data.caddr }}"></td>
            </tr>
            <tr>
                <th colspan="2" class="form-actions">
                    <input class="button primary" type="submit" name="button" id="button" value="修改">
                    <input class="button secondary" type="reset" name="button2" id="button2" value="清除">
                </th>

            </tr>
        </table>

    </form>
</section>
{% endblock %}
